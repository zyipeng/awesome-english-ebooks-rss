name: Build RSS Feed

on:
  schedule:
    # 每天 UTC 06:00 和 18:00 各跑一次（北京 14:00 / 02:00）
    # 杂志一般在周五/周六更新，每天两次足够及时
    - cron: "0 6,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate feed
        env:
          # Actions 自动注入的 token，提高 GitHub API 限额到 5000/小时
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 每本杂志保留最近 2 期（每期下载并解压 epub 提取文章）
          PER_MAGAZINE_LIMIT: "2"
          # 单篇文章正文截断到 15000 字符
          ARTICLE_MAX_CHARS: "15000"
        run: python generate_feed.py feeds

      - name: Upload feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: feeds
          path: feeds/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print feed URL
        run: |
          echo "========================================"
          echo "RSS 订阅地址（每本杂志一个独立订阅，在 RSS 阅读器中按需添加）："
          echo "  经济学人  https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feeds/economist.xml"
          echo "  纽约客    https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feeds/new_yorker.xml"
          echo "  大西洋    https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feeds/atlantic.xml"
          echo "  连线      https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feeds/wired.xml"
          echo "========================================"
